# Reference configuration for the Set-A development protocol.

data:
  max_hours: 48.0
  bin_size_hours: 1.0
  val_frac: 0.20

training:
  max_epochs: 30
  patience: 6
  batch_size: 128
  lr: 0.001
  grad_clip: 5.0
  seed: 42
  selection_metric: auprc

models:
  hidden: 64

  latent_ode:
    latent_dim: 16
    solver: dopri5
    reconstruction_weight: 0.1
    kl_weight: 0.001

  neural_cde:
    hidden_channels: 32
    interpolation: cubic
    solver: rk4
    step_size: 1.0

final_model:
  name: gru
  epochs: 11
  threshold: 0.2571
